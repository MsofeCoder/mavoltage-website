backend:
  name: git-gateway
  branch: development

media_folder: assets/images
public_folder: /assets/images

collections:
  - name: stats
    label: Stats
    files:
      - name: stats
        label: Stats Data
        file: assets/data/stats.json
        fields:
          - name: items
            label: Stats Items
            widget: list
            fields:
              - { name: icon, label: Icon (FontAwesome class), widget: string }
              - { name: target, label: Counter Target (numeric stats only), widget: number, required: false }
              - { name: text, label: Static Text (non-numeric, e.g. "15+"), widget: string, required: false }
              - { name: label, label: Label, widget: string }

  - name: services
    label: Services
    files:
      - name: services
        label: Services Data
        file: assets/data/services.json
        fields:
          - name: cards
            label: Service Cards
            widget: list
            fields:
              - { name: icon, label: Icon (FontAwesome class), widget: string }
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }

  - name: projects
    label: Projects
    files:
      - name: projects
        label: Projects Data
        file: assets/data/projects.json
        fields:
          - name: items
            label: Project Cards
            widget: list
            fields:
              - { name: tag, label: Category Tag (e.g. Industrial), widget: string }
              - { name: title, label: Location / Title, widget: string }
              - { name: client, label: Client Name, widget: string }

  - name: testimonials
    label: Testimonials
    files:
      - name: testimonials
        label: Testimonials Data
        file: assets/data/testimonials.json
        fields:
          - name: items
            label: Testimonial Cards
            widget: list
            fields:
              - { name: quote, label: Quote, widget: text }
              - { name: avatar, label: Avatar Initials (e.g. JM), widget: string }
              - { name: name, label: Client Name, widget: string }
              - { name: role, label: Role / Company, widget: string }
